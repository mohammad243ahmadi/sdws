<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Requests')}"></head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<main>
  <div th:replace="~{fragments :: flash}"></div>
  <h2>Requests sent to me</h2>
  <div class="table-wrap"><table>
    <thead><tr><th>From</th><th>Amount</th><th>Date</th><th>Status</th><th></th></tr></thead>
    <tbody>
      <tr th:each="r : ${incoming}">
        <td th:text="${r.requester.fullName} + ' (' + ${r.requester.phone} + ')'"></td>
        <td th:text="${#numbers.formatDecimal(r.amount,1,'COMMA',2,'POINT')}"></td>
        <td th:text="${#temporals.format(r.createdAt,'yyyy-MM-dd HH:mm')}"></td>
        <td th:text="${r.status}"></td>
        <td>
          <th:block th:if="${r.status.name() == 'PENDING'}">
            <form class="inline" th:action="@{/requests/{id}/accept(id=${r.id})}" method="post"><button class="btn small green">Pay</button></form>
            <form class="inline" th:action="@{/requests/{id}/decline(id=${r.id})}" method="post"><button class="btn small red">Decline</button></form>
          </th:block>
        </td>
      </tr>
      <tr th:if="${#lists.isEmpty(incoming)}"><td colspan="5" class="hint">No requests.</td></tr>
    </tbody>
  </table></div>

  <h2>Requests I sent</h2>
  <div class="table-wrap"><table>
    <thead><tr><th>To</th><th>Amount</th><th>Date</th><th>Status</th></tr></thead>
    <tbody>
      <tr th:each="r : ${sent}">
        <td th:text="${r.target.fullName} + ' (' + ${r.target.phone} + ')'"></td>
        <td th:text="${#numbers.formatDecimal(r.amount,1,'COMMA',2,'POINT')}"></td>
        <td th:text="${#temporals.format(r.createdAt,'yyyy-MM-dd HH:mm')}"></td>
        <td th:text="${r.status}"></td>
      </tr>
      <tr th:if="${#lists.isEmpty(sent)}"><td colspan="4" class="hint">No requests.</td></tr>
    </tbody>
  </table></div>
  <p><a class="btn" th:href="@{/request}">New request</a></p>
</main>
</body>
</html>
