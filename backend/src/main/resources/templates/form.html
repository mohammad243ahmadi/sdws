<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(${title})}"></head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<main>
  <div th:replace="~{fragments :: flash}"></div>
  <h2 th:text="${title}"></h2>
  <form class="card" th:action="@{${action}}" method="post">
    <p class="hint" th:if="${hint}" th:text="${hint}"></p>
    <div class="row" th:each="f : ${fields}">
      <label th:text="${f.label}"></label>
      <select th:if="${f.options != null}" th:name="${f.name}" required>
        <option th:each="o : ${f.options}" th:value="${o}" th:text="${o}"></option>
      </select>
      <input th:unless="${f.options != null}" th:name="${f.name}" th:type="${f.type}" th:value="${f.value}"
             th:step="${f.step}" th:min="${f.step}" th:required="${f.required}">
    </div>
    <button class="btn">Submit</button>
  </form>
</main>
</body>
</html>
