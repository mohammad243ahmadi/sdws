<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Receive Money')}"></head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<main>
  <div th:replace="~{fragments :: flash}"></div>
  <h2>Receive Money</h2>
  <div class="card">
    <p>Share your phone number with the sender:</p>
    <h3 th:text="${user.phone}"></h3>
    <p class="hint">Account number: <span th:text="${wallet.accountNumber}"></span>.
      Received money is added to your balance automatically.</p>
  </div>
  <h3>Recently received</h3>
  <div th:replace="~{fragments :: txTable(${txs}, false)}"></div>
</main>
</body>
</html>
