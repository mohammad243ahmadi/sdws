spring.application.name=sdws
server.port=8080

# Default: file-based H2 (no setup needed)
spring.datasource.url=jdbc:h2:file:${SDWS_DB_PATH:../data/sdws}
spring.datasource.username=sa
spring.datasource.password=

# MySQL alternative (comment the H2 lines above, uncomment these)
# spring.datasource.url=jdbc:mysql://localhost:3306/sdws?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=change-me

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Seed admin account (change the password!)
app.admin.phone=0700000000
app.admin.password=Admin@12345

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration=PT1H
app.jwt.cookie-secure=${JWT_COOKIE_SECURE:false}
