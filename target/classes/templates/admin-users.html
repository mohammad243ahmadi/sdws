<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Users')}"></head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<main>
  <div th:replace="~{fragments :: flash}"></div>
  <h2>Users</h2>
  <div class="table-wrap"><table>
    <thead><tr><th>#</th><th>Name</th><th>Phone</th><th>Email</th><th>Role</th><th>Registered</th><th>Status</th><th></th></tr></thead>
    <tbody>
      <tr th:each="u : ${users}">
        <td th:text="${u.id}"></td>
        <td th:text="${u.fullName}"></td>
        <td th:text="${u.phone}"></td>
        <td th:text="${u.email}"></td>
        <td th:text="${u.role}"></td>
        <td th:text="${#temporals.format(u.createdAt,'yyyy-MM-dd')}"></td>
        <td th:text="${u.active} ? 'Active' : 'Deactivated'"></td>
        <td>
          <form th:action="@{/admin/users/{id}/toggle(id=${u.id})}" method="post">
            <button class="btn small" th:classappend="${u.active} ? 'red' : 'green'" th:text="${u.active} ? 'Deactivate' : 'Activate'"></button>
          </form>
        </td>
      </tr>
    </tbody>
  </table></div>
</main>
</body>
</html>
