<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Admin Overview')}"></head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<main>
  <div th:replace="~{fragments :: flash}"></div>
  <h2>Admin Overview</h2>
  <div class="grid">
    <div class="card"><small>Users</small><h2 th:text="${userCount}"></h2></div>
    <div class="card"><small>Active users</small><h2 th:text="${activeCount}"></h2></div>
    <div class="card"><small>Transactions</small><h2 th:text="${txCount}"></h2></div>
    <div class="card"><small>Total wallet balance</small><h2 th:text="${#numbers.formatDecimal(totalBalance,1,'COMMA',2,'POINT')}"></h2></div>
  </div>
  <h3>Latest activity</h3>
  <div th:replace="~{fragments :: txTable(${txs}, true)}"></div>
</main>
</body>
</html>
