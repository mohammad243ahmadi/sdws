<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Transactions')}"></head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<main>
  <div th:replace="~{fragments :: flash}"></div>
  <h2>All Transactions</h2>
  <form class="card" th:action="@{/admin/transactions}" method="get">
    <div class="row"><label>Type</label>
      <select name="type">
        <option value="">All</option>
        <option th:each="o : ${T(com.sdws.wallet.model.Enums.TxType).values()}" th:value="${o}" th:text="${o}" th:selected="${o.name() == type}"></option>
      </select></div>
    <div class="row"><label>User phone contains</label><input name="phone" th:value="${phone}"></div>
    <button class="btn">Filter</button>
  </form>
  <div th:replace="~{fragments :: txTable(${txs}, true)}"></div>
</main>
</body>
</html>
