<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Transaction History')}"></head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<main>
  <div th:replace="~{fragments :: flash}"></div>
  <h2>Transaction History</h2>
  <form class="card" th:action="@{/history}" method="get">
    <label>Filter by type</label>
    <select name="type" onchange="this.form.submit()">
      <option value="">All</option>
      <option th:each="o : ${T(com.sdws.wallet.model.Enums.TxType).values()}" th:value="${o}" th:text="${o}" th:selected="${o.name() == type}"></option>
    </select>
  </form>
  <div th:replace="~{fragments :: txTable(${txs}, false)}"></div>
</main>
</body>
</html>
